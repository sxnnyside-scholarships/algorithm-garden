name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Verify version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag is SemVer and matches all package manifests
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::tag is not SemVer: $TAG"; exit 1; }

          web_ver="$(node -p "require('./web/package.json').version")"
          api_ver="$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' api/Project.toml | head -1)"
          runner_ver="$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' runner/Project.toml | head -1)"

          for pair in "web/package.json:$web_ver" "api/Project.toml:$api_ver" "runner/Project.toml:$runner_ver"; do
            name="${pair%%:*}"
            val="${pair#*:}"
            [ "$val" = "$version" ] \
              || { echo "::error::$name version ($val) does not match tag ($version)"; exit 1; }
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tag commit is on default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"

  gate:
    name: Quality gate and bundle (ubuntu-24.04)
    needs: verify-version
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install just
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.58.0
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Install Julia 1.13.3
        run: |
          curl -fsSL https://julialang-s3.julialang.org/bin/linux/x64/1.13/julia-1.13.3-linux-x86_64.tar.gz -o /tmp/julia.tar.gz
          tar -xzf /tmp/julia.tar.gz -C /opt
          echo "/opt/julia-1.13.3/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: just install
      - name: Run quality gate
        run: just check
      - name: Build production web bundle
        run: cd web && bun run build
      - name: Package deployment bundle
        env:
          TARGET: x86_64-unknown-linux-gnu
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: just package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux
          path: dist/*
          retention-days: 1

  docker:
    name: Build and push (${{ matrix.name }})
    needs: [verify-version, gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: all-in-one, image: algorithm-garden, context: ., dockerfile: Dockerfile }
          - { name: runner, image: algorithm-garden-runner, context: ./runner, dockerfile: runner/Dockerfile }
          - { name: api, image: algorithm-garden-api, context: ./api, dockerfile: api/Dockerfile }
          - { name: web, image: algorithm-garden-web, context: ./web, dockerfile: web/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  publish:
    name: Publish GitHub Release
    needs: [verify-version, gate, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Install tools
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.58.0,git-cliff@2.14.2
      - name: Checksums and release notes
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum * > SHA256SUMS)
          just changelog
          {
            printf '\n### Container Images (`ghcr.io`)\n'
            printf -- '- All-in-one (Coolify / single container): `ghcr.io/%s/algorithm-garden:%s`\n' "$OWNER" "$VERSION"
            printf -- '- Sandbox Runner: `ghcr.io/%s/algorithm-garden-runner:%s`\n' "$OWNER" "$VERSION"
            printf -- '- HTTP API: `ghcr.io/%s/algorithm-garden-api:%s`\n' "$OWNER" "$VERSION"
            printf -- '- Web Workspace: `ghcr.io/%s/algorithm-garden-web:%s`\n' "$OWNER" "$VERSION"
          } >> RELEASE_NOTES.md
      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}

